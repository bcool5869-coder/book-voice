<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--mute:#6b665e;--line:#e3ddd2;--acc:#b5532a;--acc-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161412;--card:#201d1a;--ink:#efe9df;--mute:#a39b8f;--line:#38322c;--acc:#e07a4a;--acc-ink:#161412}}
:root[data-theme="dark"]{--bg:#161412;--card:#201d1a;--ink:#efe9df;--mute:#a39b8f;--line:#38322c;--acc:#e07a4a;--acc-ink:#161412}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 215px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{font-size:.85rem;color:var(--mute);display:block;margin-bottom:4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=password],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:280px;resize:vertical;font-family:"Noto Sans Devanagari",Inter,sans-serif;font-size:1.05rem;line-height:1.8}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 160px}
button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute);cursor:pointer}
.drop.on{border-color:var(--acc)}
#status{color:var(--mute);font-size:.9rem;min-height:1.4em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#pageLbl{min-width:90px;text-align:center;font-weight:600}
#thumb{max-width:100%;border-radius:10px;border:1px solid var(--line);display:none;margin-bottom:12px}
@media (max-width:520px){.bar .in{flex-wrap:nowrap;gap:6px}.bar button{flex:1;padding:9px 4px;font-size:.9rem;white-space:nowrap}#pageLbl{min-width:44px}.bar label{font-size:.85rem;white-space:nowrap}}
#reader{display:none;max-height:40vh;overflow:auto;margin-bottom:12px;padding:12px;border-radius:10px;background:var(--bg);font-family:"Noto Sans Devanagari",Inter,sans-serif;font-size:1.15rem;line-height:2}
#reader .w.on{background:var(--acc);color:var(--acc-ink);border-radius:4px;padding:0 2px}
details summary{cursor:pointer;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Book Voice</h1>
  <p class="sub">Upload a PDF, photos of pages, or a text file. It reads one page at a time, in English, Hindi and Sanskrit.</p>

  <div class="card">
    <div class="row">
      <div><label for="key">Gemini API key (saved only in this browser)</label><div style="display:flex;gap:6px"><input id="key" type="password" autocomplete="new-password" placeholder="AIza..."><button class="ghost" data-forget="key" aria-label="Forget Gemini key">✕</button></div></div>
      <div><label for="engine">Voice engine</label><select id="engine">
        <option value="gemini">Gemini TTS (Gemini key)</option>
        <option value="openai/gpt-audio">GPT Audio (OpenRouter key)</option>
        <option value="openai/gpt-audio-mini">GPT Audio Mini, cheapest (OpenRouter key)</option>
        <option value="vagdhenu">Vāgdhenu: Sanskrit chant, in browser, free (~290 MB once)</option>
        <option value="parler">Indic Parler-TTS: in browser, free (~950 MB once, PC only)</option>
      </select></div>
      <div><label for="voice">Voice</label><select id="voice"></select></div>
      <div><label for="speed">Speed</label><select id="speed"><option>0.8</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="orKey">OpenRouter key (optional, used for scanning pages)</label><div style="display:flex;gap:6px"><input id="orKey" type="password" autocomplete="new-password" placeholder="sk-or-..."><button class="ghost" data-forget="orKey" aria-label="Forget OpenRouter key">✕</button></div></div>
      <div><label for="orModel">OpenRouter scan model</label><select id="orModel">
        <option value="google/gemma-4-31b-it:free">Gemma 4 31B by Google (free)</option>
        <option value="thinkingmachines/inkling:free">Inkling by Thinking Machines (free)</option>
        <option value="google/gemma-4-26b-a4b-it:free">Gemma 4 26B by Google (free)</option>
        <option value="dots-studio/dots-3-note-preview:free">Dots3-Note (free)</option>
        <option value="thinkingmachines/inkling-small:free">Inkling Small (free)</option>
        <option value="nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free">Nemotron 3 Nano Omni by NVIDIA (free)</option>
        <option value="google/gemini-3.8-flash">Gemini 3.8 Flash (best, uses credit)</option>
      </select></div>
    </div>
    <details style="margin-top:10px"><summary>Models (advanced)</summary>
      <div class="row" style="margin-top:8px">
        <div><label for="ocrModel">Page-reading model</label><input id="ocrModel" value="gemini-3.8-flash"></div>
        <div><label for="ttsModel">Voice model</label><input id="ttsModel" value="gemini-3.8-flash-tts"></div>
      </div>
    </details>
  </div>

  <div class="card">
    <div id="drop" class="drop" tabindex="0" role="button">Tap or drop a PDF / images / .txt here
      <input id="file" type="file" accept=".pdf,image/*,.txt" multiple hidden></div>
  </div>

  <div class="card">
    <img id="thumb" alt="Current page">
    <div id="reader"></div>
    <label for="text">Page text (you can fix mistakes before it speaks)</label>
    <textarea id="text" placeholder="Page text will appear here…"></textarea>
    <div id="status" aria-live="polite"></div>
  </div>
</main>

<div class="bar"><div class="in">
  <button class="ghost" id="prev" aria-label="Previous page">◀</button>
  <span id="pageLbl">–</span>
  <button class="ghost" id="next" aria-label="Next page">▶</button>
  <button class="ghost" id="scan">🔍 Scan</button>
  <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="auto" checked> Auto next</label>
</div><div class="in" style="margin-top:8px">
  <button class="ghost" id="back" aria-label="Back 5 seconds">⏪ 5s</button>
  <button id="play">▶ Read</button>
  <button class="ghost" id="pause">⏸ Pause</button>
  <button class="ghost" id="stop">■ Stop</button>
  <button class="ghost" id="fwd" aria-label="Forward 5 seconds">5s ⏩</button>
</div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $ = id => document.getElementById(id);
const API = "https://generativelanguage.googleapis.com/v1beta";
const VOICES = ["Kore","Charon","Aoede","Puck","Leda","Orus","Fenrir","Zephyr","Despina","Sulafat","Achird","Gacrux","Schedar","Iapetus","Umbriel","Algieba","Erinome","Rasalgethi","Laomedeia","Achernar","Alnilam","Pulcherrima","Vindemiatrix","Sadachbia","Sadaltager","Zubenelgenubi","Callirrhoe","Autonoe","Enceladus","Algenib"];
const OCR_PROMPT = `You are reading one page of a book (often astrology / jyotish) aloud.
Write out ALL the text on this page in natural reading order (follow columns correctly).
Rules:
- Keep each language in its ORIGINAL script: English in Latin, Hindi and Sanskrit in Devanagari. Never translate or transliterate.
- Copy Sanskrit shlokas exactly, with every matra, visarga (ः), anusvara (ं), halant (्) and danda (। ॥). Put each shloka line on its own line.
- Skip page numbers, running headers/footers, and decorative marks.
- Read tables row by row as plain sentences.
- For a horoscope/kundli chart or diagram, write one short line describing it, in the page's main language.
- Output ONLY the page text, nothing else. If the page is blank, output nothing.`;
const STYLE = "Calm, clear audiobook narration at a steady pace. Pronounce Sanskrit shlokas in proper Sanskrit, slowly and rhythmically, fully voicing visarga and anusvara; read Hindi in natural standard Hindi and English in Indian English.";

const store = (k, v) => { try { v === undefined ? v = localStorage.getItem(k) : localStorage.setItem(k, v) } catch {} return v };
const OR_VOICES = ["marin","cedar","coral","sage","shimmer","alloy","ash","ballad","echo","verse"];
const OR_TTS_PROMPT = "You are a text-to-speech reader, not a chat assistant. Speak the user's message aloud EXACTLY as written, word for word, in its original languages. Never add, skip, translate, explain, greet or reply. " + STYLE;
// Indic Parler speakers recommended by AI4Bharat for each language
const ENGINE_VOICES = { gemini: VOICES, vagdhenu: ["Chant (metre detected automatically)"],
  parler: ["Divya (Hindi)", "Rohit (Hindi)", "Aman (Hindi)", "Rani (Hindi)", "Aryan (Sanskrit)", "Thoma (English)", "Mary (English)"] };
const fillVoices = () => $("voice").innerHTML = (ENGINE_VOICES[$("engine").value] || OR_VOICES).map(v => `<option>${v}</option>`).join("");
$("engine").addEventListener("change", () => { fillVoices(); store("bv_voice", $("voice").value); });
for (const id of ["key","engine","voice","speed","ocrModel","ttsModel","orKey","orModel"]) {
  if (id === "voice") fillVoices();
  const saved = store("bv_" + id); if (saved) $(id).value = saved;
  $(id).addEventListener("change", () => store("bv_" + id, $(id).value));
  $(id).addEventListener("input", () => store("bv_" + id, $(id).value));
}
for (const b of document.querySelectorAll("[data-forget]")) b.onclick = () => {
  const id = b.dataset.forget; $(id).value = ""; store("bv_" + id, ""); status("Key removed from this browser.");
};

// pages: [{kind:"pdf"|"img"|"text", get: async()=>{image?, mime?, text?}}]
let pages = [], cur = 0, textCache = {}, audioCache = {}, playing = null, runId = 0;
const status = s => $("status").textContent = s;

// retries busy/overloaded errors (429, 5xx) with growing waits: 3s, 8s, 15s
async function call(url, body, auth = { "x-goog-api-key": $("key").value.trim() }, retries = 3) {
  for (let attempt = 0; ; attempt++) {
    const r = await waitFor(fetch(url, { method: "POST", headers: { "Content-Type": "application/json", ...auth }, body: JSON.stringify(body), signal: AbortSignal.timeout(120000) }));
    const j = await r.json().catch(() => ({}));
    if (r.ok) return j;
    const err = new Error((Array.isArray(j) ? j[0] : j)?.error?.message || ("HTTP " + r.status));
    if (!(r.status === 429 || r.status >= 500) || attempt >= retries) throw err;
    const wait = [3, 8, 15][attempt];
    status(`Server is busy, retrying in ${wait}s…`);
    await new Promise(res => setTimeout(res, wait * 1000));
  }
}

// Shows a seconds counter on the status line while a request runs, so a slow server doesn't look frozen.
// Requests give up after 120 s (AbortSignal.timeout) so the next backup model gets its turn.
async function waitFor(promise) {
  const base = $("status").textContent.replace(/ \(\d+s\)$/, ""), t0 = Date.now();
  const tick = setInterval(() => { if ($("status").textContent.startsWith(base)) status(`${base} (${Math.round((Date.now() - t0) / 1000)}s)`); }, 1000);
  try { return await promise; }
  catch (e) { throw e.name === "TimeoutError" ? new Error("no answer after 2 minutes") : e; }
  finally { clearInterval(tick); }
}

const b64 = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(",")[1]); fr.readAsDataURL(blob); });

async function loadFiles(files) {
  pages = []; textCache = {}; audioCache = {}; stop();
  for (const f of files) {
    if (f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")) {
      const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
      for (let i = 1; i <= pdf.numPages; i++) pages.push({ get: async () => {
        const pg = await pdf.getPage(i), vp = pg.getViewport({ scale: 2 });
        const c = Object.assign(document.createElement("canvas"), { width: vp.width, height: vp.height });
        await pg.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        // ponytail: also tries the PDF's embedded text layer would be cheaper, but old scanned books have none and Devanagari text layers are often garbled
        const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
        return { image: blob, mime: "image/jpeg" };
      }});
    } else if (f.type.startsWith("image/")) {
      pages.push({ get: async () => ({ image: f, mime: f.type }) });
    } else {
      // text file: split into ~1500-char pages on paragraph boundaries
      const t = await f.text(); let buf = "";
      for (const para of t.split(/\n\s*\n/)) {
        if (buf && buf.length + para.length > 1500) { const s = buf; pages.push({ get: async () => ({ text: s }) }); buf = ""; }
        buf += (buf ? "\n\n" : "") + para;
      }
      if (buf.trim()) { const s = buf; pages.push({ get: async () => ({ text: s }) }); }
    }
  }
  cur = 0; show();
}

async function pageText(i) {
  if (textCache[i] !== undefined) return textCache[i];
  return textCache[i] = (async () => {
    const p = await pages[i].get();
    if (p.text !== undefined) return p.text;
    const orKey = $("orKey").value.trim();
    if (orKey) {
      // OpenRouter: chosen model first, then two free Google models as backups (free servers often time out)
      const models = [...new Set([$("orModel").value, ...[...$("orModel").options].map(o => o.value).filter(v => v.endsWith(":free"))])];
      const body = { messages: [{ role: "user", content: [
        { type: "image_url", image_url: { url: `data:${p.mime};base64,${await b64(p.image)}` } },
        { type: "text", text: OCR_PROMPT }] }] };
      for (const [n, m] of models.entries()) {
        try {
          const j = await call("https://openrouter.ai/api/v1/chat/completions", { ...body, model: m }, { Authorization: "Bearer " + orKey }, 1);
          return (j.choices?.[0]?.message?.content || "").trim();
        } catch (e) {
          if (n < models.length - 1) { status(`${m} failed, trying ${models[n + 1]}…`); continue; }
          if (!$("key").value.trim()) throw e;
          status("OpenRouter failed, scanning with Gemini instead…"); // falls through to the Gemini path below
        }
      }
    }
    const body ={ contents: [{ parts: [{ inline_data: { mime_type: p.mime, data: await b64(p.image) } }, { text: OCR_PROMPT }] }] };
    // if the chosen model stays overloaded, fall back to older Flash models
    const models = [...new Set([$("ocrModel").value.trim(), "gemini-3.6-flash", "gemini-3.5-flash-lite"])];
    for (const [n, m] of models.entries()) {
      try {
        const j = await call(`${API}/models/${m}:generateContent`, body);
        return (j.candidates?.[0]?.content?.parts || []).map(x => x.text || "").join("").trim();
      } catch (e) {
        if (n === models.length - 1) throw e;
        status(`${m} is busy, trying ${models[n + 1]}…`);
      }
    }
  })().catch(e => { delete textCache[i]; throw e; });
}

// split text into chunks so the first audio starts fast and no request is too long
function chunks(t, max = 900) {
  const out = []; let buf = "";
  for (const line of t.split(/(?<=[\n।॥.?!])\s*/)) {
    if (buf && buf.length + line.length > max) { out.push(buf); buf = ""; }
    buf += (buf ? " " : "") + line;
  }
  if (buf.trim()) out.push(buf);
  return out;
}

function findAudio(o) {
  if (!o || typeof o !== "object") return null;
  if (o.type === "audio" && o.data) return o;
  if (o.inlineData?.data) return { data: o.inlineData.data, mime_type: o.inlineData.mimeType };
  let last = null;
  for (const v of Object.values(o)) { const a = findAudio(v); if (a) last = a; }
  return last;
}

function toWavUrl(data, rate = 24000) {
  const bytes = typeof data === "string" ? Uint8Array.from(atob(data), c => c.charCodeAt(0)) : data;
  if (String.fromCharCode(...bytes.slice(0, 4)) === "RIFF") return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
  // raw mono 16-bit PCM: add a WAV header
  const h = new DataView(new ArrayBuffer(44)), w = (o, s) => [...s].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); h.setUint32(4, 36 + bytes.length, true); w(8, "WAVEfmt "); h.setUint32(16, 16, true);
  h.setUint16(20, 1, true); h.setUint16(22, 1, true); h.setUint32(24, rate, true); h.setUint32(28, rate * 2, true);
  h.setUint16(32, 2, true); h.setUint16(34, 16, true); w(36, "data"); h.setUint32(40, bytes.length, true);
  return URL.createObjectURL(new Blob([h, bytes], { type: "audio/wav" }));
}

// OpenRouter audio only comes as a stream: collect the base64 pcm16 (24 kHz mono) chunks
// ponytail: no busy-retry here (unlike call()); add one if OpenRouter voice errors show up often
async function orSpeak(text, model, voice) {
  const r = await waitFor(fetch("https://openrouter.ai/api/v1/chat/completions", { signal: AbortSignal.timeout(120000),
    method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + $("orKey").value.trim() },
    body: JSON.stringify({ model, modalities: ["text", "audio"], audio: { voice, format: "pcm16" }, stream: true,
      messages: [{ role: "system", content: OR_TTS_PROMPT }, { role: "user", content: text }] })
  }));
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || ("HTTP " + r.status)); }
  const reader = r.body.getReader(), dec = new TextDecoder(), parts = []; let buf = "";
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    const lines = (buf += dec.decode(value, { stream: true })).split("\n"); buf = lines.pop();
    for (const l of lines) {
      if (!l.startsWith("data:") || l.includes("[DONE]")) continue;
      let j; try { j = JSON.parse(l.slice(5)); } catch { continue; }
      if (j.error) throw new Error(j.error.message || "OpenRouter error");
      const a = j.choices?.[0]?.delta?.audio?.data; if (a) parts.push(Uint8Array.from(atob(a), c => c.charCodeAt(0)));
    }
  }
  if (!parts.length) throw new Error("No audio in reply");
  const all = new Uint8Array(parts.reduce((n, p) => n + p.length, 0)); let o = 0;
  for (const p of parts) { all.set(p, o); o += p.length; }
  return toWavUrl(all);
}

// Resolves to an audio URL, or null when this part has no voice to read it (it is then skipped).
function speak(text, engine = $("engine").value, voice = $("voice").value) {
  if (engine === "vagdhenu" && !text.split("\n").every(isSanskrit)) {
    // Vāgdhenu only knows Sanskrit: hand Hindi/English lines to a key-based voice if there is one
    if ($("key").value.trim()) [engine, voice] = ["gemini", "Kore"];
    else if ($("orKey").value.trim()) [engine, voice] = ["openai/gpt-audio-mini", "marin"];
    else return Promise.resolve(null);
  }
  const key = engine + "|" + voice + "|" + text;
  const job = engine === "vagdhenu" ? serial(() => vagSpeak(text))
    : engine === "parler" ? serial(() => parlerSpeak(text, voice.split(" ")[0]))
    : engine !== "gemini" ? orSpeak(text, engine, voice)
    : call(`${API}/interactions`, {
        model: $("ttsModel").value.trim(),
        input: [{ type: "user_input", content: [{ type: "text", text, annotations: [{ type: "speech_metadata", style: STYLE }] }] }],
        response_format: { type: "audio" },
        generation_config: { speech_config: [{ voice }] }
      }).then(j => { const a = findAudio(j); if (!a) throw new Error("No audio in reply"); return toWavUrl(a.data); });
  return audioCache[key] ??= job.catch(e => { delete audioCache[key]; throw e; });
}

// Text → parts. Parler works best one sentence at a time; Vāgdhenu gets one verse (up to ॥) at a time.
function partsFor(text) {
  const engine = $("engine").value;
  if (engine === "parler") return chunks(text, 200);
  if (engine !== "vagdhenu") return chunks(text);
  const out = []; let buf = "", sa = null;
  for (const line of text.split("\n").filter(l => l.trim())) {
    const s = isSanskrit(line);
    if (buf && s !== sa) { out.push(...(sa ? [buf] : chunks(buf))); buf = ""; }
    buf += (buf ? "\n" : "") + line; sa = s;
    if (s && line.includes("॥")) { out.push(buf); buf = ""; }
  }
  if (buf) out.push(...(sa ? [buf] : chunks(buf)));
  return out;
}

// A Devanagari line with no common Hindi function words is treated as Sanskrit.
// ponytail: word-list guess; can misjudge very short lines. Upgrade: have the scan model tag Sanskrit lines.
const HINDI_WORDS = /(^|\s)(है|हैं|था|थे|थी|की|के|का|में|और|से|को|यह|वह|नहीं|होता|होती|होते|इस|उस|लिए|भी|पर|जो|तो|कि|ने|हो)(?=$|\s|[।,.?!])/;
const isSanskrit = line => /[ऀ-ॿ]/.test(line) && !/[A-Za-z]/.test(line) && !HINDI_WORDS.test(line);

// ---------- In-browser voices: no key, models download once and are cached by the browser ----------
const ORT_URL = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.2/dist/ort.all.min.js"; // the version Vāgdhenu is built for
const VAG_URL = "https://cdn.jsdelivr.net/gh/hemanth/sanskrit-tts-web@aedd58f6f96d13b24b4899dc4faec0bcc8b53fdc/dist/index.mjs";
const TF_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0";
const PARLER = "https://huggingface.co/naklitechie/indic-parler-tts-ONNX/resolve/main/";
const DAC = "https://huggingface.co/onnx-community/dac_44khz-ONNX/resolve/main/onnx/decoder_model_fp16.onnx";
let localQ = Promise.resolve(), genEpoch = 0, ortP, vagP, parlerP;
// one local generation at a time: ONNX sessions can't run two calls at once
const serial = fn => { const p = localQ.then(fn); localQ = p.catch(() => {}); return p; };
const loadOrt = () => ortP ??= window.ort ? Promise.resolve(window.ort) : new Promise((res, rej) => {
  const s = Object.assign(document.createElement("script"), { src: ORT_URL, onload: () => res(window.ort), onerror: () => rej(new Error("Could not load ONNX Runtime")) });
  document.head.append(s);
});

async function fetchCached(url, label) {
  const cache = await caches.open("book-voice-models").catch(() => null);
  const hit = await cache?.match(url);
  if (hit) return new Uint8Array(await hit.arrayBuffer());
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${label}: download failed (HTTP ${r.status})`);
  const total = +r.headers.get("content-length") || 0, reader = r.body.getReader(), parts = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read(); if (done) break;
    parts.push(value); got += value.length;
    status(`Downloading ${label}: ${Math.round(got / 1e6)}${total ? " / " + Math.round(total / 1e6) : ""} MB (one time only)`);
  }
  const blob = new Blob(parts);
  await cache?.put(url, new Response(blob)).catch(() => {});
  return new Uint8Array(await blob.arrayBuffer());
}

// Vāgdhenu (IISc / Hemanth HM): Sanskrit śloka chanting, metre-aware. Downloads and caches its own models.
const vagVoice = () => vagP ??= (async () => {
  await loadOrt();
  const { default: sanskritTts } = await import(VAG_URL);
  return sanskritTts({ onProgress: s => status("Sanskrit voice: " + (s?.message || "loading…")) });
})().catch(e => { vagP = null; throw e; });
async function vagSpeak(text) {
  const epoch = genEpoch, v = await vagVoice();
  if (epoch !== genEpoch) throw new Error("stopped");
  return (await v.chant(text)).url;
}

// Indic Parler-TTS (AI4Bharat), ONNX export by naklitechie, run with WebGPU.
const parlerModel = () => parlerP ??= (async () => {
  if (!navigator.gpu) throw new Error("Indic Parler needs WebGPU (Chrome or Edge on a PC)");
  const ort = await loadOrt();
  const { AutoTokenizer } = await import(TF_URL);
  // keep the KV cache on the GPU between steps instead of copying hundreds of MB back each token
  const opt = { executionProviders: ["webgpu"], preferredOutputLocation: "gpu-buffer" };
  const sess = async (name, n) => ort.InferenceSession.create(await fetchCached(PARLER + name + ".onnx", `voice model ${n}/4`),
    { ...opt, externalData: [{ path: name + ".onnx.data", data: await fetchCached(PARLER + name + ".onnx.data", `voice model ${n}/4`) }] });
  const promptTok = await AutoTokenizer.from_pretrained("naklitechie/indic-parler-tts-ONNX");
  const descTok = await AutoTokenizer.from_pretrained("google/flan-t5-large"); // the description goes through flan-T5, like AI4Bharat's own example
  const enc = await sess("text_encoder_q4f16", 1), dec0 = await sess("decoder_model_q4f16", 2), dec = await sess("decoder_with_past_model_q4f16", 3);
  const dac = await ort.InferenceSession.create(await fetchCached(DAC, "voice model 4/4"), { executionProviders: ["webgpu", "wasm"] });
  return { ort, promptTok, descTok, enc, dec0, dec, dac };
})().catch(e => { parlerP = null; throw e; });

function sampleTopK(lg, off, n, k = 50) {
  const idx = Array.from({ length: n }, (_, i) => i).sort((a, b) => lg[off + b] - lg[off + a]).slice(0, k);
  const mx = lg[off + idx[0]], w = idx.map(i => Math.exp(lg[off + i] - mx));
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let j = 0; j < k; j++) if ((r -= w[j]) <= 0) return idx[j];
  return idx[0];
}

const f16 = h => { const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 31, f = h & 1023;
  return e === 0 ? s * 2 ** -14 * (f / 1024) : e === 31 ? (f ? NaN : s * Infinity) : s * 2 ** (e - 15) * (1 + f / 1024); };

// Port of parler_tts generate(): delay pattern + ParlerTTSLogitsProcessor + top-k 50 sampling, then DAC decode.
async function parlerSpeak(text, speaker) {
  const epoch = genEpoch, m = await parlerModel(), { ort } = m;
  const T = (type, data, dims) => new ort.Tensor(type, data, dims), i64 = a => BigInt64Array.from(a, BigInt);
  const ones = n => i64(Array(n).fill(1));
  const desc = `${speaker}'s voice is clear and calm, speaking at a slow, steady pace. The recording is of very high quality, with the speaker's voice sounding clear and very close up, with no background noise.`;
  const d = Array.from(m.descTok(desc).input_ids.data, Number), p = Array.from(m.promptTok(text).input_ids.data, Number);
  const encMask = T("int64", ones(d.length), [1, d.length]);
  const { last_hidden_state } = await m.enc.run({ input_ids: T("int64", i64(d), [1, d.length]), attention_mask: encMask });
  const NC = 9, BOS = 1025, EOS = 1024, MAX = 2600; // MAX steps ≈ 30 s of audio (86 steps per second)
  const codes = Array.from({ length: NC }, () => [BOS]), done = Array(NC).fill(false);
  let fin = 0; // codebooks below fin have finished and are forced to EOS
  let out = await m.dec0.run({ codec_input_ids: T("int64", i64(Array(NC).fill(BOS)), [1, NC, 1]),
    prompt_input_ids: T("int64", i64(p), [1, p.length]), prompt_attention_mask: T("int64", ones(p.length), [1, p.length]),
    encoder_hidden_states: last_hidden_state, encoder_attention_mask: encMask });
  try {
    for (let step = 1; step < MAX; step++) {
      if (epoch !== genEpoch) throw new Error("stopped");
      const [, L, V] = out.logits.dims, lg = await out.logits.getData();
      if (fin < NC - 1 && done[fin]) fin++;
      const next = codes.map((c, cb) => {
        const tok = step <= cb ? BOS                      // delay pattern: codebook cb starts cb steps late
          : cb < fin || done[cb] ? EOS                    // finished codebooks keep emitting EOS/PAD
          : sampleTopK(lg, (cb * L + L - 1) * V, EOS + 1); // real codes 0–1023 plus EOS
        c.push(tok); if (tok === EOS) done[cb] = true;
        return tok;
      });
      if (done.every(Boolean)) break;
      if (step % 43 === 0) status(`Making voice: ${(step / 86).toFixed(1)} s so far…`);
      const feed = { codec_input_ids: T("int64", i64(next), [1, NC, 1]), encoder_attention_mask: encMask };
      for (const [k, v] of Object.entries(out)) if (k.startsWith("present.")) feed["past_key_values." + k.slice(8)] = v;
      const past = feed["past_key_values.0.decoder.key"].dims[2];
      feed.attention_mask = T("int64", ones(past + 1), [1, past + 1]);
      feed.cache_position = T("int64", i64([past]), [1]);
      const prev = out; out = await m.dec.run(feed);
      const keep = new Set(Object.values(out));
      for (const t of Object.values(prev)) if (!keep.has(t)) t.dispose?.();
    }
  } finally { for (const t of Object.values(out)) t.dispose?.(); }
  // undo the delay: frame t of codebook cb sits at position t + 1 + cb; drop frames holding EOS/PAD
  const frames = [];
  for (let t = 0; ; t++) {
    const f = codes.map((c, cb) => c[t + 1 + cb]);
    if (f.some(x => x === undefined)) break;
    if (f.every(x => x < EOS)) frames.push(f);
  }
  if (!frames.length) throw new Error("Parler made no speech for this part");
  const F = frames.length, flat = new BigInt64Array(NC * F);
  frames.forEach((f, t) => f.forEach((x, cb) => flat[cb * F + t] = BigInt(x)));
  const { audio_values } = await m.dac.run({ audio_codes: T("int64", flat, [1, NC, F]) });
  const raw = await audio_values.getData(), pcm = new Int16Array(raw.length);
  for (let i = 0; i < raw.length; i++) {
    const v = audio_values.type === "float16" && !(raw instanceof Float32Array) ? f16(raw[i]) : raw[i];
    pcm[i] = Math.max(-1, Math.min(1, v)) * 32767;
  }
  return toWavUrl(new Uint8Array(pcm.buffer), 44100);
}

async function show() {
  $("pageLbl").textContent = pages.length ? `${cur + 1} / ${pages.length}` : "–";
  $("prev").disabled = cur <= 0; $("next").disabled = cur >= pages.length - 1;
  $("text").value = ""; $("thumb").style.display = "none";
  if (!pages.length) return;
  const i = cur, p = await pages[i].get();
  if (i !== cur) return;
  if (p.image) { $("thumb").src = URL.createObjectURL(p.image); $("thumb").style.display = "block"; }
  if (textCache[i] !== undefined) $("text").value = await textCache[i].catch(() => "");
}

async function readFrom(i) {
  const e = $("engine").value, need = e === "gemini" ? "key" : e === "vagdhenu" || e === "parler" ? null : "orKey";
  if (need && !$(need).value.trim()) { status(need === "key" ? "Paste your Gemini API key first." : "Paste your OpenRouter key first."); $(need).focus(); return; }
  const id = ++runId;
  while (i < pages.length && id === runId) {
    cur = i; await show();
    status(`Reading page ${i + 1}…`);
    let text;
    try { text = await pageText(i); } catch (e) { status("Page reading failed: " + e.message); return; }
    if (id !== runId) return;
    $("text").value = text; // edits made in the box are saved to textCache on input
    if (i + 1 < pages.length) pageText(i + 1).catch(() => {}); // prefetch next page
    const parts = partsFor(text);
    for (let k = 0; k < parts.length && id === runId; k++) {
      status(`Page ${i + 1}: part ${k + 1} of ${parts.length}`);
      let url;
      try { url = await speak(parts[k]); }
      catch (e) {
        // backup voices: any key-based engine you have a key for, other than the one that just failed
        const backups = [["gemini", "Kore", "key"], ["openai/gpt-audio-mini", "marin", "orKey"]]
          .filter(([en, , k]) => en !== $("engine").value && $(k).value.trim());
        for (const [en, v] of backups) {
          if (id !== runId) return;
          status(`Voice failed (${e.message}), trying ${en}…`);
          try { url = await speak(parts[k], en, v); break; } catch (e2) { e = e2; }
        }
        if (url === undefined) { if (id === runId) status("Voice failed: " + e.message); return; }
      }
      if (k + 1 < parts.length) speak(parts[k + 1]).catch(() => {});
      if (id !== runId) return;
      if (!url) { status(`Skipped a non-Sanskrit part (add a Gemini or OpenRouter key to hear it).`); continue; }
      status(`Page ${i + 1}: reading part ${k + 1} of ${parts.length}`);
      await new Promise(res => {
        playing = new Audio(url); playing.playbackRate = +$("speed").value; $("pause").textContent = "⏸ Pause";
        karaoke(parts[k], playing);
        playing.onended = playing.onerror = res; playing.play().catch(res);
      });
    }
    if (id !== runId) return;
    status(`Finished page ${i + 1}.`);
    if (!$("auto").checked) return;
    i++;
  }
}

function stop() { runId++; genEpoch++; if (playing) { playing.pause(); playing = null; } $("reader").style.display = "none"; status("Stopped."); }

// Highlights the word being spoken. Gemini TTS gives no word timings, so this is an estimate:
// position in the audio ≈ position in the text, weighted by word length.
// ponytail: drifts a little around long pauses (। ॥, line breaks); real timings would need a TTS with word timestamps
function karaoke(text, audio) {
  const box = $("reader"), spans = [], ends = []; let total = 0;
  box.textContent = "";
  for (const w of text.split(/(\s+)/)) {
    if (!w) continue;
    if (/^\s+$/.test(w)) { box.append(w.includes("\n") ? document.createElement("br") : " "); continue; }
    const s = Object.assign(document.createElement("span"), { textContent: w, className: "w" });
    box.append(s); spans.push(s); ends.push(total += w.length + 1);
  }
  box.style.display = "block";
  let last = -1;
  const tick = () => {
    if (playing !== audio) return;
    if (audio.duration && spans.length) {
      const pos = audio.currentTime / audio.duration * total;
      let i = ends.findIndex(e => e > pos); if (i < 0) i = spans.length - 1;
      if (i !== last) { spans[last]?.classList.remove("on"); spans[i].classList.add("on"); spans[i].scrollIntoView({ block: "nearest" }); last = i; }
    }
    requestAnimationFrame(tick);
  };
  tick();
}

$("drop").onclick = () => $("file").click();
$("drop").onkeydown = e => (e.key === "Enter" || e.key === " ") && $("file").click();
$("file").onchange = e => loadFiles([...e.target.files]);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("on"); };
$("drop").ondragleave = () => $("drop").classList.remove("on");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("on"); loadFiles([...e.dataTransfer.files]); };
$("prev").onclick = () => { stop(); cur--; show(); };
$("next").onclick = () => { stop(); cur++; show(); };
$("play").onclick = () => { if (!pages.length) { const t = $("text").value.trim(); if (!t) return status("Upload a file or type some text."); pages = [{ get: async () => ({ text: t }) }]; cur = 0; } readFrom(cur); };
$("stop").onclick = stop;
$("scan").onclick = async () => {
  if (!pages.length) return status("Upload a file first.");
  if (!$("key").value.trim() && !$("orKey").value.trim()) { status("Paste a Gemini or OpenRouter key first."); $("key").focus(); return; }
  const i = cur; status(`Scanning page ${i + 1}…`);
  try { const t = await pageText(i); if (i === cur) $("text").value = t; status(`Page ${i + 1} scanned. Press Read to listen.`); }
  catch (e) { status("Page reading failed: " + e.message); }
};
$("pause").onclick = () => {
  if (!playing) return;
  if (playing.paused) { playing.play(); $("pause").textContent = "⏸ Pause"; status("Playing…"); }
  else { playing.pause(); $("pause").textContent = "▶ Resume"; status("Paused."); }
};
// ponytail: skips only within the current ~900-char audio part; can't jump back into the previous part
$("back").onclick = () => playing && (playing.currentTime = Math.max(0, playing.currentTime - 5));
$("fwd").onclick = () => playing && (playing.currentTime = Math.min(playing.duration - 0.1, playing.currentTime + 5));
$("speed").addEventListener("change", () => playing && (playing.playbackRate = +$("speed").value));
$("text").addEventListener("input", () => { textCache[cur] = Promise.resolve($("text").value); });
</script>
